name: PoC Hunt

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Fuzzer target to run"
        required: true
        default: "binary_feed_fuzzer"
      seconds:
        description: "Seconds to fuzz this target"
        required: true
        default: "1800"

jobs:
  poc-hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm lld

      - name: Build fuzz targets
        run: |
          sed -i 's/\r$//' .clusterfuzzlite/build.sh
          chmod +x .clusterfuzzlite/build.sh
          export SRC="$PWD"
          export OUT="$PWD/out"
          .clusterfuzzlite/build.sh
          echo "Built targets:"
          ls -lah out

      - name: Run selected target
        continue-on-error: true
        run: |
          TARGET="${{ github.event.inputs.target }}"
          FUZZ_SECONDS="${{ github.event.inputs.seconds }}"

          mkdir -p "findings/$TARGET"

          if [ ! -x "./out/$TARGET" ]; then
            echo "Target not found or not executable: ./out/$TARGET"
            echo "Available targets:"
            ls -lah out
            exit 2
          fi

          export ASAN_OPTIONS="detect_leaks=1:abort_on_error=1:symbolize=1:allocator_may_return_null=1"
          export UBSAN_OPTIONS="print_stacktrace=1:halt_on_error=1"

          echo "============================================================"
          echo "POC HUNT TARGET: $TARGET"
          echo "SECONDS: $FUZZ_SECONDS"
          echo "============================================================"

          set +e
          timeout "$((FUZZ_SECONDS + 120))s" \
            "./out/$TARGET" \
              -max_total_time="$FUZZ_SECONDS" \
              -max_len=65536 \
              -artifact_prefix="findings/$TARGET/" \
              -print_final_stats=1 \
              -use_value_profile=1 \
              -detect_leaks=1 \
              -rss_limit_mb=2048 \
              2>&1 | tee "findings/$TARGET/run.log"
          rc="${PIPESTATUS[0]}"
          set -e

          echo "$rc" > "findings/$TARGET/exit_code.txt"
          echo "Exit code: $rc"

          echo "Crash-like artifacts:"
          find "findings/$TARGET" -type f \( -name 'crash-*' -o -name 'leak-*' -o -name 'timeout-*' -o -name 'oom-*' \) -print || true

          echo "Sanitizer evidence:"
          grep -RniE "ERROR: AddressSanitizer|ERROR: UndefinedBehaviorSanitizer|SUMMARY:|DEADLYSIGNAL|Test unit written" "findings/$TARGET" || true

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poc-hunt-${{ github.event.inputs.target }}-${{ github.run_id }}
          path: findings/
          if-no-files-found: warn
