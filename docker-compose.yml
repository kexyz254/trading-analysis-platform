# VPS deployment: two services sharing one SQLite journal file, reusing the
# existing Dockerfile unchanged (only `command:` differs per service). Both
# use `restart: unless-stopped` so a VPS reboot or a crashed process comes
# back on its own, without anyone SSHing in to restart it by hand.
services:
  engine:
    build: .
    command: python run_system.py
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./logs:/app/logs
      - ./trading_assistant/models:/app/trading_assistant/models
      - ./trading_system.db:/app/trading_system.db
    # Orchestrator.request_shutdown() (wired to SIGTERM in run_system.py)
    # checks a shutdown flag between symbols in the retrain/tournament
    # loops, not just at the top of the outer while-loop - bounds the
    # worst case to roughly one symbol's retrain+tournament pass (~45s
    # measured against live data, see config.yaml's own comments on
    # per-symbol timing) rather than the full 15-25 minute universe pass.
    # 60s gives that a real margin instead of racing Docker's own 30s
    # default before it escalates to SIGKILL.
    stop_grace_period: 60s
    # Retrain/tournament passes train RandomForest + XGBoost per symbol
    # across the whole discovered universe (up to ~30 symbols) - with no
    # cap, a memory spike during that pass can OOM the entire VPS, not
    # just this container, on a small box. Measured against the actual
    # deployment VPS (Hetzner, 1.9GB RAM, 1 vCPU - confirmed via `free -h`/
    # `nproc`): 1000m + dashboard's 600m leaves ~350MB headroom for the OS/
    # Docker daemon - tighter than earlier, since the dashboard's own limit
    # was raised (see its comment below); watch `free -h` after this change
    # for a few days. cpus is capped at the box's own single core - Docker
    # rejects any limit above the host's actual CPU count outright, it
    # doesn't just clamp it. Re-tune both if you move to a different plan.
    mem_limit: 1000m
    cpus: 0.8
    # Docker's own json-file log driver has NO size cap by default -
    # distinct from (and in addition to) this app's own already-rotated
    # file logging (logging_setup.py's RotatingFileHandler, 50MB max).
    # Every log line also goes to stdout, which Docker captures
    # separately - without this, that capture alone can silently fill the
    # VPS disk over months of real 24/7 operation.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  dashboard:
    build: .
    command: uvicorn webapp.server:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    # Needed even though the dashboard never places an order: /api/markets
    # and /api/ohlcv construct an exchange client via the same
    # build_exchange() run_system.py uses, which unconditionally refuses
    # to build ANY exchange instance in mode: live without real API keys -
    # even for read-only public ticker/OHLCV calls. Without this, those
    # two endpoints 502 (confirmed live: "mode: live requires
    # BINANCE_API_KEY/BINANCE_API_SECRET to be set... refusing to start").
    env_file: .env
    depends_on:
      - engine
    ports:
      # SECURITY: the dashboard has zero authentication (by design). Two
      # bindings, both explicit host IPs - NEVER "0.0.0.0:8000:8000" or a
      # bare "8000:8000" on a public VPS, either of which publishes live
      # trading positions/decisions/model internals to the entire public
      # internet on this box's real IP.
      #   - 127.0.0.1: reachable only via an SSH tunnel
      #     (ssh -L 8000:localhost:8000 user@vps) from the VPS's own loopback.
      #   - the Tailscale interface IP: reachable only from other devices on
      #     this same private Tailscale network (e.g. a phone) - still never
      #     touches the public internet, since Tailscale's interface is a
      #     private overlay network, not the VPS's public NIC. Update this
      #     IP if the VPS's Tailscale identity is ever reset (`tailscale ip -4`
      #     to check) - it's normally stable across reboots, but it IS this
      #     specific machine's assigned address, not a fixed constant.
      - "127.0.0.1:8000:8000"
      - "100.93.64.23:8000:8000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      # SINGLE-FILE mount + SQLite WAL hazard: WAL keeps its sidecar files
      # (-wal/-shm) NEXT TO the database, which under a single-file mount
      # means each container's own private overlay fs, not the shared host
      # file. That is survivable for a reader, but a SECOND WRITER through
      # a private WAL corrupts the main file ("database disk image is
      # malformed" - happened in production 2026-07-16). The dashboard must
      # therefore stay STRICTLY READ-ONLY on this database; anything the
      # dashboard needs to persist goes in dashboard_data/ below. Enforced
      # in code: every dashboard-side Journal is constructed with
      # initialize=False (no schema DDL, no migrations - see Journal.__init__).
      # TODO(deep fix): migrate trading_system.db into a shared DIRECTORY
      # mount (e.g. ./data:/app/data for both services) so the WAL sidecars
      # live on the host for both containers - that removes this whole class
      # of hazard instead of guarding it. Requires moving the db file on the
      # host plus updating both services' paths and the backup cron in one
      # deliberate maintenance step.
      - ./trading_system.db:/app/trading_system.db
      # Dashboard-owned analytics (price calls etc.): a DIRECTORY mount, so
      # the analytics db's WAL sidecars live inside the shared directory and
      # there is exactly one writer (this container) - the supported setup.
      - ./dashboard_data:/app/dashboard_data
    # Read-only, low-traffic web process - far lighter than the engine's
    # retrain/tournament workload, but still uncapped by default without
    # this. 256m was too tight in practice: /api/markets and /api/ohlcv
    # call ccxt's load_markets(), which pulls in Binance's FULL market
    # list (thousands of pairs, not just the ~30 tracked symbols) - this
    # container was observed idling at ~150MB and crash-looping the
    # moment a real request exercised that path. Even 450m turned out
    # tight in real 24/7 operation (observed sitting at ~94% of that limit
    # continuously, not just during a request spike) - 600m gives real
    # margin instead of leaving it one bad moment away from an OOM-kill.
    mem_limit: 600m
    cpus: 0.2
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # Visibility only, not automatic remediation - plain `docker compose`
    # does not restart a container on "unhealthy" status by itself (that
    # needs Swarm mode or a separate watcher). This makes a hung dashboard
    # show up as unhealthy in `docker compose ps`/`docker inspect`, and
    # gives an external uptime monitor (see RUNBOOK.md) the exact same
    # signal to page on. curl isn't installed on python:3.11-slim, so this
    # uses the stdlib instead of adding a package just for this.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=5).status == 200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
