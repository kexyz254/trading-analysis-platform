<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ATS Pro Terminal</title>
    <link rel="stylesheet" href="/pro/static/style.css">
    <script src="https://unpkg.com/lightweight-charts@5.0.1/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
    <div id="app">
        <header id="topbar">
            <div class="tb-left">
                <h1 class="logo">ATS</h1>
                <select id="symbol-select"></select>
                <div class="timeframe-tabs" id="timeframe-tabs">
                    <button data-tf="15m">15m</button>
                    <button data-tf="1h" class="active">1h</button>
                    <button data-tf="4h">4h</button>
                    <button data-tf="1d">1d</button>
                </div>
            </div>
            <div class="tb-center">
                <span id="current-price" class="price-big">—</span>
                <span id="price-change" class="change">—</span>
                <span id="live-dot" class="dot">●</span>
                <span id="mode-badge" class="badge">—</span>
            </div>
            <div class="tb-right">
                <span id="health-ring" class="health">●</span>
                <span id="uptime">Uptime: —</span>
            </div>
        </header>
        <div id="main-container">
            <section id="chart-panel" class="panel">
                <div id="chart-container"><div id="chart"></div></div>
                <div id="volume-chart"></div>
            </section>
            <aside id="right-panel">
                <div class="card"><h3>AI Prediction</h3><div class="card-content" id="prediction-content">Loading...</div></div>
                <div class="card"><h3>Current Position</h3><div class="card-content" id="position-content">No open position</div></div>
                <div class="card"><h3>Top Features</h3><div class="card-content" id="features-content">No model promoted yet</div></div>
                <div class="card"><h3>Recent Trades</h3><div class="card-content" id="trades-content">No trades yet</div></div>
            </aside>
        </div>
        <footer id="bottombar">
            <span id="engine-status">Engine: ●</span>
            <span id="learning-status">Learning: ●</span>
            <span id="risk-status">Risk: ●</span>
            <span id="exchange-status">Exchange: ●</span>
            <span id="status-text">Ready</span>
        </footer>
    </div>
    <script src="/pro/static/app.js"></script>
</body>
</html>
